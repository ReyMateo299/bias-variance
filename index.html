<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bias-Variance Tradeoff Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 {
            text-align: center;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            background: #f4f4f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 10px;
        }
        .description {
            font-size: 0.9em;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }
        canvas {
            background: #fff;
        }
    </style>
</head>
<body>

    <h1>Bias-Variance Tradeoff</h1>
    
    <div class="controls">
        <div class="slider-container">
            <label for="biasSlider"><strong>Bias: <span id="biasVal">0.50</span></strong></label>
            <input type="range" id="biasSlider" min="0" max="1" step="0.05" value="0.5">
            <div class="description">How far the average model is from the true function.</div>
        </div>
        
        <div class="slider-container">
            <label for="varSlider"><strong>Variance: <span id="varVal">0.50</span></strong></label>
            <input type="range" id="varSlider" min="0" max="2" step="0.1" value="0.5">
            <div class="description">How much individual models fluctuate (overfitting).</div>
        </div>
    </div>

    <div>
        <canvas id="tradeoffChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('tradeoffChart').getContext('2d');
        
        // Generate X values
        const xValues = Array.from({length: 100}, (_, i) => i * 0.1);
        
        // True Function: y = sin(x)
        const trueY = xValues.map(x => Math.sin(x));

        let chart;

        function generateData(bias, variance) {
            // Expected model (Bias pulls it away from the sine wave towards a flat line)
            const expectedY = xValues.map(x => (Math.sin(x) * (1 - bias)) + (0.1 * x * bias));
            
            // Generate 3 sample models to show variance
            const sample1 = xValues.map((x, i) => expectedY[i] + Math.sin(x * 4) * variance);
            const sample2 = xValues.map((x, i) => expectedY[i] + Math.cos(x * 5) * variance);
            const sample3 = xValues.map((x, i) => expectedY[i] + Math.sin(x * 7 + 1) * variance);

            return { expectedY, sample1, sample2, sample3 };
        }

        function initChart() {
            const data = generateData(0.5, 0.5);

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: xValues.map(x => x.toFixed(1)),
                    datasets: [
                        {
                            label: 'True Function',
                            data: trueY,
                            borderColor: 'black',
                            borderWidth: 3,
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0,
                            zIndex: 10
                        },
                        {
                            label: 'Expected Model Prediction',
                            data: data.expectedY,
                            borderColor: 'blue',
                            borderWidth: 3,
                            fill: false,
                            pointRadius: 0,
                            zIndex: 5
                        },
                        {
                            label: 'Sample Model 1',
                            data: data.sample1,
                            borderColor: 'rgba(255, 99, 132, 0.5)',
                            borderWidth: 1.5,
                            fill: false,
                            pointRadius: 0
                        },
                        {
                            label: 'Sample Model 2',
                            data: data.sample2,
                            borderColor: 'rgba(75, 192, 192, 0.5)',
                            borderWidth: 1.5,
                            fill: false,
                            pointRadius: 0
                        },
                        {
                            label: 'Sample Model 3',
                            data: data.sample3,
                            borderColor: 'rgba(255, 159, 64, 0.5)',
                            borderWidth: 1.5,
                            fill: false,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false, 
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        y: {
                            min: -3,
                            max: 3,
                            title: { display: true, text: 'y' }
                        },
                        x: {
                            title: { display: true, text: 'x' },
                            ticks: { maxTicksLimit: 10 }
                        }
                    }
                }
            });
        }

        function updateChart() {
            const bias = parseFloat(document.getElementById('biasSlider').value);
            const variance = parseFloat(document.getElementById('varSlider').value);
            
            document.getElementById('biasVal').textContent = bias.toFixed(2);
            document.getElementById('varVal').textContent = variance.toFixed(2);

            const data = generateData(bias, variance);

            chart.data.datasets[1].data = data.expectedY;
            chart.data.datasets[2].data = data.sample1;
            chart.data.datasets[3].data = data.sample2;
            chart.data.datasets[4].data = data.sample3;
            
            chart.update();
        }

        // Event Listeners
        document.getElementById('biasSlider').addEventListener('input', updateChart);
        document.getElementById('varSlider').addEventListener('input', updateChart);

        // Initialize
        initChart();
    </script>
</body>
</html>
